name: "CI Release"

# Identical in every LogSquirl plugin and managed by LogSquirl-Plugin-CI
# (scripts/sync-plugin.sh): change the shared workflow there, not here.
#
# Publishes the CI Build of the tagged commit; it does not build. Set the
# version in plugin.json and CMakeLists.txt and add its CHANGELOG section on
# main, then push the tag.
on:
  push:
    tags:
      - 'v*'
  # Dispatch it from the tag ("Use workflow from: <tag>"): the `release`
  # environment holding the signing secrets admits only v* tags.
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag this workflow is dispatched from (e.g. v1.2.0)"
        required: true
      ci-run-id:
        description: "Run ID of the CI Build push run for the tagged commit (leave empty to find it)"
        required: false

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    uses: 64x-lunicorn/LogSquirl-Plugin-CI/.github/workflows/plugin-release.yml@2570b74ec46f8be33720381c98aa568f4b962e04 # v1.2.0
    permissions:
      contents: write # create the release
      actions: read # the CI Build run and its artifacts
      id-token: write # Sigstore signature and attestations
      attestations: write
    with:
      tag: ${{ inputs.tag }}
      ci-run-id: ${{ inputs.ci-run-id }}
    # Without it, the secrets of the `release` environment that the Sign macOS
    # job declares resolve to empty strings in the called workflow, although
    # the documentation suggests `environment:` there is enough
    # (actions/runner#4453). The plugin has no repository or organisation
    # secrets, and the called workflow is this organisation's, pinned by SHA.
    secrets: inherit # zizmor: ignore[secrets-inherit]
