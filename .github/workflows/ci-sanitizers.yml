name: "CI Sanitizers"

# This plugin's own workflow, beside the shared ones (ci-build.yml and
# workflow-security.yml come from LogSquirl-Plugin-CI and are not edited
# here). It builds the tests in Debug with AddressSanitizer and
# UndefinedBehaviorSanitizer (the dev-asan preset) on Linux and runs them:
# a sanitizer report fails its test, and the test fails the job. Qt is the
# version of the LogSquirl release in .github/plugin-ci.json's host_ref,
# installed as the CI Build installs it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-sanitizers-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HOST_REPO: 64x-lunicorn/LogSquirl

jobs:
  sanitizers:
    name: ASan and UBSan (Linux x64)
    runs-on: ubuntu-24.04
    # A cold Qt install, the sanitized Debug build and its test run stay
    # well below this.
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      # The catch_discover_tests step runs the sanitized test program at build
      # time, too; leak detection is off there as in the dev-asan test preset.
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Qt version of the host release, read as the CI Build reads it:
      # LogSquirl's build image carries it as ENV QT_VERSION.
      - name: Read the Qt version of the host release
        id: host
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          host_ref=$(jq -r '.host_ref // ""' .github/plugin-ci.json)
          if ! [[ $host_ref =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)[1-9][0-9]*)?$ ]]; then
            echo "::error file=.github/plugin-ci.json::host_ref '$host_ref' is not a LogSquirl release tag"
            exit 1
          fi
          qt=$(gh api -H "Accept: application/vnd.github.raw" \
            "repos/$HOST_REPO/contents/docker/ubuntu24.04/Dockerfile?ref=$host_ref" |
            sed -n 's/^ENV QT_VERSION=\([0-9.]*\)$/\1/p' | head -1)
          if ! [[ $qt =~ ^6\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cannot read the Qt version of LogSquirl $host_ref from docker/ubuntu24.04/Dockerfile"
            exit 1
          fi
          qt_modules=$(jq -r '(.qt_modules // []) | join(" ")' .github/plugin-ci.json)
          echo "LogSquirl $host_ref: Qt $qt${qt_modules:+, modules $qt_modules}"
          {
            echo "qt-version=$qt"
            echo "qt-modules=$qt_modules"
          } >> "$GITHUB_OUTPUT"

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: ${{ steps.host.outputs.qt-version }}
          arch: linux_gcc_64
          modules: ${{ steps.host.outputs.qt-modules }}
          cache: true
          # Pinned to a commit as in the CI Build (LogSquirl-Plugin-CI's
          # plugin-build.yml), which says why.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
          py7zrversion: ==1.1.0

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67 # v6

      # ASan's shadow memory does not fit every address layout of the
      # kernel's highest mmap randomisation; 28 bits is what it supports.
      - name: Limit mmap randomisation for ASan
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake --preset dev-asan

      - name: Build
        run: cmake --build --preset dev-asan

      # The preset sets QT_QPA_PLATFORM=offscreen and the sanitizer options;
      # -fno-sanitize-recover=undefined makes an undefined behaviour report
      # end its test like an ASan report does.
      - name: Test
        run: ctest --preset dev-asan
