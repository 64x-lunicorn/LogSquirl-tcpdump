name: "Workflow Security"

# Identical in every LogSquirl plugin and managed by LogSquirl-Plugin-CI
# (scripts/sync-plugin.sh): change the shared workflow there, not here.
#
# The weekly run picks up newly published advisories for the pinned actions.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/**'
  push:
    branches: [main]
    paths:
      - '.github/**'
  schedule:
    - cron: '17 4 * * 2'
  workflow_dispatch:

concurrency:
  group: workflow-security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  security:
    name: Security
    uses: 64x-lunicorn/LogSquirl-Plugin-CI/.github/workflows/plugin-security.yml@217ac03dd27cd7275edb754863d48f22c5edad38 # v1.0.3
    permissions:
      contents: read
      security-events: write # zizmor findings to code scanning
