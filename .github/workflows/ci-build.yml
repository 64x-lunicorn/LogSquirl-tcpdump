name: "CI Build"

# Identical in every LogSquirl plugin and managed by LogSquirl-Plugin-CI
# (scripts/sync-plugin.sh): change the shared workflow there, not here. What is
# plugin-specific lives in plugin.json and .github/plugin-ci.json.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  ci:
    name: CI
    uses: 64x-lunicorn/LogSquirl-Plugin-CI/.github/workflows/plugin-build.yml@fab0686c6966dcd8a4146dd90addd34ad4b9f34c # v1.1.0
    permissions:
      contents: read
